name: OneTV auto-post

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Maximum new events to publish in this run'
        required: false
        default: '10'
        type: string

permissions:
  contents: write

concurrency:
  group: onetv-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Event-compatible OneTV autopublisher
        env:
          ONETV_SOURCE_URL: ${{ secrets.ONETV_SOURCE_URL || 'https://oneball.live/' }}
          ONETV_STREAM_BASE_URL: ${{ secrets.ONETV_STREAM_BASE_URL || 'https://hls.live123.fans/live/' }}
          PLAYER_BASE_URL: ${{ secrets.PLAYER_BASE_URL || 'https://sports803.github.io/player/' }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL || 'https://sports-803-1b806-default-rtdb.firebaseio.com' }}
          FIREBASE_EVENTS_PATH: ${{ secrets.FIREBASE_EVENTS_PATH || 's803config/todaysMatches' }}
          AUTOMATION_BLOGGER_POSTS_PATH: ${{ secrets.AUTOMATION_BLOGGER_POSTS_PATH || 'automation/bloggerPosts' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          FIREBASE_PUBLIC_WRITE: 'false'
          MAX_POSTS_PER_RUN: ${{ inputs.batch_limit || vars.MAX_POSTS_PER_RUN || '10' }}
          EVENT_WINDOW_HOURS: '24'
          ACTIVE_GRACE_HOURS: '2'
        run: npm run auto-publish

      - name: Commit posted-ID log
        run: |
          if git diff --quiet -- data/onetv-posted.json; then
            echo "No new OneTV IDs to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/onetv-posted.json
          git commit -m "chore: record OneTV autoposts"
          git push
