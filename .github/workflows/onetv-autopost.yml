name: OneTV auto-post

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Maximum new events to publish in this run'
        required: false
        default: '10'
        type: string

permissions:
  contents: write

concurrency:
  group: onetv-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OneTV scanner and autoposter
        env:
          ONETV_SOURCE_URL: ${{ secrets.ONETV_SOURCE_URL || 'https://oneball.live/' }}
          ONETV_STREAM_BASE_URL: ${{ secrets.ONETV_STREAM_BASE_URL || 'https://hls.live123.fans/live/' }}
          PLAYER_BASE_URL: ${{ secrets.PLAYER_BASE_URL || 'https://sports803.github.io/player/' }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_EVENTS_PATH: ${{ secrets.FIREBASE_EVENTS_PATH || 's803config/todaysMatches' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          AUTOPOST_BATCH_LIMIT: ${{ inputs.batch_limit || vars.AUTOPOST_BATCH_LIMIT || '10' }}
        run: node scripts/onetv-autopost.mjs

      - name: Commit posted-ID log
        run: |
          if git diff --quiet -- data/onetv-posted.json; then
            echo "No new OneTV IDs to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/onetv-posted.json
          git commit -m "chore: record OneTV autoposts"
          git push
